name: Bug report
description: Report a reproducible OpenCodeKit problem
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, credentials, or private repository content.
  - type: input
    id: version
    attributes:
      label: OpenCodeKit version
      placeholder: opencodekit --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: CachyOS, Node.js 22, terminal name
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, authorization headers, paths, and private code.
      render: shell
